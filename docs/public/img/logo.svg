<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" class="max-w-[280px] sm:max-w-[340px] aspect-square animate-float">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="vueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42b883" />
      <stop offset="100%" stop-color="#35495E" />
    </linearGradient>
  </defs>

  <!-- Background Glow -->
  <circle cx="200" cy="180" r="130" fill="#42b883" opacity="0.15" filter="url(#shadow)" />

  <!-- Multi-Tabs Stacked Structure -->
  <g transform="translate(0, 10)">
    <!-- Inactive Background Tab 3 -->
    <rect x="90" y="80" width="220" height="150" rx="12" fill="#35495e" opacity="0.3" />

    <!-- Inactive Background Tab 2 -->
    <rect x="80" y="95" width="240" height="150" rx="12" fill="#35495e" opacity="0.6" />
    <path d="M100,95 L150,65 L210,65 L230,95 Z" fill="#35495e" opacity="0.6" />

    <!-- Main Active TabPanel Card -->
    <g filter="url(#shadow)">
      <!-- Main Content Container Window -->
      <rect x="70" y="110" width="260" height="160" rx="12" fill="#35495e" stroke="#42b883" stroke-width="2" />

      <!-- Window Header / Tab Bar Row -->
      <path d="M70,122 L70,110 L330,110 L330,122" fill="none" />
      <line x1="70" y1="150" x2="330" y2="150" stroke="#42b883" stroke-width="1.5" opacity="0.4" />

      <!-- Window Traffic Light dots -->
      <circle cx="95" cy="130" r="4" fill="#EF4444" opacity="0.8" />
      <circle cx="110" cy="130" r="4" fill="#F59E0B" opacity="0.8" />
      <circle cx="125" cy="130" r="4" fill="#10B981" opacity="0.8" />

      <!-- Tab Headers on top of panel -->
      <path d="M145,150 L155,122 L215,122 L225,150 Z" fill="#42b883" opacity="0.25" />
      <rect x="155" y="122" width="60" height="28" rx="4" fill="#42b883" />
      <text x="185" y="140" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#0f172a" text-anchor="middle">Tab 1</text>

      <rect x="225" y="128" width="55" height="22" rx="4" fill="#1e293b" opacity="0.8" />
      <text x="252" y="143" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#94a3b8" text-anchor="middle">Tab 2</text>

      <!-- Vue 3 Crystal / Triangle Motif inside active content panel -->
      <g transform="translate(165, 170) scale(0.65)">
        <polygon points="50,15 90,85 10,85" fill="#42b883" opacity="0.9" />
        <polygon points="50,35 75,80 25,80" fill="#35495E" />
        <polygon points="50,45 65,75 35,75" fill="#FFFFFF" opacity="0.9" />
      </g>


      <!-- Active Indicator Pill -->
      <rect x="175" y="250" width="50" height="4" rx="2" fill="#42b883" />

    </g>
  </g>


</svg>