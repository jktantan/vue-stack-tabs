# 通用质量门禁：类型、单测、Lint、格式、库构建与打包后验证。
#
# 文档站部署另有 deploy-docs.yml；这里只做代码质量校验。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与本地开发保持一致（@tsconfig/node26 / @types/node 26）
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test

      - name: Lint
        run: pnpm run lint:check

      - name: Format check
        run: pnpm run format:check

      - name: Build library
        run: pnpm run lib:build

      - name: Verify packaged artifacts
        run: pnpm exec node scripts/verify-packaged.mjs
